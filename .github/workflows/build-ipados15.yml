name: Build HeadunitPad for iPadOS 15

on:
workflow_dispatch:

jobs:
build:
runs-on: macos-15

```
steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Select Xcode 16.4
    run: |
      sudo xcode-select -s /Applications/Xcode_16.4.app
      xcodebuild -version

  - name: Build HeadunitPad
    run: |
      xcodebuild \
        -project HeadunitPad/HeadunitPad.xcodeproj \
        -scheme HeadunitPad \
        -configuration Release \
        -sdk iphoneos \
        -archivePath "$RUNNER_TEMP/HeadunitPad.xcarchive" \
        IPHONEOS_DEPLOYMENT_TARGET=15.0 \
        CODE_SIGNING_ALLOWED=NO \
        CODE_SIGNING_REQUIRED=NO \
        archive

  - name: Prepare IPA
    run: |
      set -e

      APP_PATH="$RUNNER_TEMP/HeadunitPad.xcarchive/Products/Applications/HeadunitPad.app"
      IPA_DIR="$RUNNER_TEMP/ipa"

      rm -rf "$IPA_DIR"
      mkdir -p "$IPA_DIR/Payload"

      cp -R "$APP_PATH" "$IPA_DIR/Payload/HeadunitPad.app"

      cd "$IPA_DIR"
      zip -r "$RUNNER_TEMP/HeadunitPad-iPadOS15.ipa" Payload

      echo "IPA created:"
      ls -lh "$RUNNER_TEMP/HeadunitPad-iPadOS15.ipa"

  - name: Upload IPA
    uses: actions/upload-artifact@v4
    with:
      name: HeadunitPad-iPadOS15
      path: ${{ runner.temp }}/HeadunitPad-iPadOS15.ipa
      if-no-files-found: error
      retention-days: 7
```
