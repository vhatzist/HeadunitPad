name: Find HeadunitPad Xcode Project

on:
  workflow_dispatch:

jobs:
  find-project:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Xcode project
        run: |
          echo "========================================"
          echo "Current directory"
          echo "========================================"
          pwd

          echo ""
          echo "========================================"
          echo "Top-level contents"
          echo "========================================"
          ls -la

          echo ""
          echo "========================================"
          echo "Xcode projects and workspaces"
          echo "========================================"
          find . \( -name "*.xcodeproj" -o -name "*.xcworkspace" \) -print

          echo ""
          echo "========================================"
          echo "Directory tree"
          echo "========================================"
          find . -maxdepth 3 -type d -print | sort
